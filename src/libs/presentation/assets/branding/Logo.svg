  <path d="M28 12a12 12 0 0 0-8-3.8" stroke="#503A1C" stroke-width="5.5" stroke-linecap="round"/>
  <text x="36" y="28" font-family="Montserrat, Inter, sans-serif" font-size="23" font-weight="700" fill="#305233">oti</text>
  <!-- El punto de la i es un pin coral -->
  <circle cx="72.5" cy="10.5" r="3" fill="#E15D3B"/>
</svg>
